app = "your-app-name"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_PORT = '5001'
  APP_HOST = '0.0.0.0'

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
